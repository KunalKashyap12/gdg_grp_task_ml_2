# ===================================================================
# Spring Boot Configuration for FloraScan AI Backend Integration
# ===================================================================

server:
  port: 8080

spring:
  application:
    name: florascan-backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

# ML Microservice Connection Parameters
ml:
  service:
    # Use "http://localhost:8000" for local development outside Docker
    # Use "http://ml-service:8000" when running inside Docker Compose
    url: ${ML_SERVICE_URL:http://localhost:8000}
    timeout-ms: 10000
    max-retries: 2
  mock:
    enabled: ${ML_MOCK_ENABLED:false}

# Logging Configuration
logging:
  level:
    com.florascan.backend: DEBUG
    org.springframework.web: INFO
